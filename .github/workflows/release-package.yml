name: Reusable release 

on: 
  workflow_call:
    inputs: 
      bump:
        description: Which part of the version to raise
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.12'
    outputs:
      version: 
        value: ${{ jobs.release.outputs.version }}

permissions: 
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade build pytest

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q 

      - name: Bump version
        id: bump
        run: python .github/scripts/bump_version.py "${{ inputs.bump }}" >> "$GITHUB_OUTPUT"

      - name: Write changelog entry
        run: python .github/scripts/write_changelog.py "${{ steps.bump.outputs.version }}" 

      - name: Build distributions
        run: python -m build

      - name: Commit version and changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/dockmanifest/__init__.py CHANGELOG.md
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
          
      - uses: actions/upload-artifact@v4
        with:
          name: dockmanifest-${{ steps.bump.outputs.version }}
          path: dist/

      - name: Create Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            dist/* \
            --title "dockmanifest v${{ steps.bump.outputs.version }}" \
            --notes-file .github/release-notes.md

      
        
      
        
